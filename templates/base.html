{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{% static "app.css" %}" \>
    {% block css_files %}{% endblock %}
  </head>
  <body>
    <header id="main-navigation">
      <h1> 
        <a href="{% url "starting-page" %}"> Arcade </a>
      </h1>
      <div>
        <nav class="functionality"> 
          <a href="{% url "posts-page" %}" >All games</a> 
        </nav>
      </div>
    </header>

    {% block content %}
    {% endblock %}

    <div id="chat-window" class="chat-popup">
      <div class="chat-header">
        <h3>Support Chat</h3>
        <button id="close-chat">×</button>
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="message received">
          <p>Hi! How can I help you today?</p>
        </div>
      </div>
      <form id="chat-form" class="chat-input-area" method="POST" action="{% url 'chat' %}">
        {% csrf_token %}
        <input type="text" name="chat_input" id="chat-input" placeholder="Type a message..." required autocomplete="off">
        <button type="submit">Send</button>
      </form>
    </div>

    <button id="toggle-chat-btn" class="floating-chat-btn" aria-label="Help Service">
      Help
    </button>
 
    <script>
      const chatBtn = document.getElementById('toggle-chat-btn');
      const chatWindow = document.getElementById('chat-window');
      const closeChatBtn = document.getElementById('close-chat');
      const chatForm = document.getElementById('chat-form');
      const chatMessages = document.getElementById('chat-messages');

      chatBtn.addEventListener('click', () => {
        chatWindow.classList.toggle('active');
        if (chatWindow.classList.contains('active')) {
          document.getElementById('chat-input').focus();
        }
      });

      closeChatBtn.addEventListener('click', () => {
        chatWindow.classList.remove('active');
      });

      chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const input = document.getElementById('chat-input');
        const message = input.value;
        if (!message) return;

        const formData = new FormData(chatForm);

        // Append user message immediately
        appendMessage('sent', message);
        input.value = '';

        try {
          const response = await fetch(chatForm.action, {
            method: 'POST',
            body: formData,
            headers: {
              'X-Requested-With': 'XMLHttpRequest'
            }
          });

          if (response.ok) {
            const data = await response.json();
            appendMessage('received', data.bot);
          } else {
            appendMessage('received', 'Sorry, something went wrong.');
          }
        } catch (error) {
          console.error('Error:', error);
          appendMessage('received', 'Network error. Please try again.');
        }
      });

      function appendMessage(type, text) {
        const div = document.createElement('div');
        div.classList.add('message', type);
        const p = document.createElement('p');
        p.textContent = text;
        div.appendChild(p);
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
    </script>
  </body>
</html>
